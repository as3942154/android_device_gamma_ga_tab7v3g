name: Test Device Tree

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate device tree
        run: |
          set -e

          echo "=== Required Files ==="

          required_files="
          AndroidBoard.mk
          AndroidProducts.mk
          BoardConfig.mk
          device.mk
          device_ga_tab7v3g.mk
          MTKbootimg.mk
          recovery.fstab
          system.prop
          vendorsetup.sh
          "

          for file in $required_files; do
            if [ ! -e "$file" ]; then
              echo "ERROR: Missing $file"
              exit 1
            fi
            echo "OK: $file"
          done

          echo
          echo "=== Board Configuration ==="

          grep -q 'TARGET_BOARD_PLATFORM.*mt6572' BoardConfig.mk
          echo "OK: MT6572"

          grep -q 'TARGET_CPU_ABI.*armeabi-v7a' BoardConfig.mk
          echo "OK: armeabi-v7a"

          grep -q 'TARGET_ARCH.*arm' BoardConfig.mk
          echo "OK: ARM"

          grep -q 'TARGET_BOOTLOADER_BOARD_NAME.*w706' BoardConfig.mk
          echo "OK: W706"

          echo
          echo "=== Product Configuration ==="

          grep -n 'ga_tab7v3g' AndroidProducts.mk device_ga_tab7v3g.mk vendorsetup.sh || true

          if ! grep -q 'ga_tab7v3g' AndroidProducts.mk; then
            echo "ERROR: ga_tab7v3g not found in AndroidProducts.mk"
            exit 1
          fi

          if ! grep -q 'ga_tab7v3g' vendorsetup.sh; then
            echo "ERROR: ga_tab7v3g lunch target not found in vendorsetup.sh"
            exit 1
          fi

          echo
          echo "=== Configuration Summary ==="

          grep -E \
            'TARGET_BOARD_PLATFORM|TARGET_CPU_ABI|TARGET_CPU_ABI2|TARGET_ARCH|TARGET_ARCH_VARIANT|TARGET_BOOTLOADER_BOARD_NAME' \
            BoardConfig.mk

          echo
          echo "=== Device Tree Validation Passed ==="

      - name: Validate build configuration
        run: |
          set -e

          echo "=== Build Configuration ==="

          check_config() {
            file="$1"
            pattern="$2"
            description="$3"

            if grep -Eq "$pattern" "$file"; then
              echo "OK: $description"
            else
              echo "ERROR: $description"
              echo "Expected pattern: $pattern"
              exit 1
            fi
          }

          check_config BoardConfig.mk \
            '^TARGET_BOARD_PLATFORM[[:space:]]*:?=[[:space:]]*mt6572' \
            "MT6572 board platform"

          check_config BoardConfig.mk \
            '^TARGET_ARCH[[:space:]]*:?=[[:space:]]*arm' \
            "ARM architecture"

          check_config BoardConfig.mk \
            '^TARGET_ARCH_VARIANT[[:space:]]*:?=[[:space:]]*armv7-a-neon' \
            "ARMv7-A NEON"

          check_config BoardConfig.mk \
            '^TARGET_CPU_ABI[[:space:]]*:?=[[:space:]]*armeabi-v7a' \
            "armeabi-v7a ABI"

          check_config BoardConfig.mk \
            '^TARGET_CPU_ABI2[[:space:]]*:?=[[:space:]]*armeabi' \
            "armeabi secondary ABI"

          check_config BoardConfig.mk \
            '^TARGET_BOOTLOADER_BOARD_NAME[[:space:]]*:?=[[:space:]]*w706' \
            "W706 bootloader board"

          echo
          echo "=== Product Definition ==="

          grep -E \
            'PRODUCT_(NAME|DEVICE|BRAND|MODEL|MANUFACTURER)[[:space:]]*[:]?=' \
            device_ga_tab7v3g.mk || true

          echo
          echo "=== Build Configuration Validation Passed ==="

      - name: Inspect CM11 build compatibility
        run: |
          set -e

          echo "=== Fetching CM build system ==="

          git clone --depth=1 \
            https://github.com/CyanogenmodMT6572/android_build.git \
            cm_build

          echo
          echo "=== CM Build System ==="
          ls -la cm_build
          ls -la cm_build/core
          ls -la cm_build/target

          echo
          echo "=== Device Tree Makefiles ==="

          for file in \
            AndroidBoard.mk \
            BoardConfig.mk \
            device.mk \
            device_ga_tab7v3g.mk \
            MTKbootimg.mk \
            AndroidProducts.mk
          do
            echo
            echo "----- $file -----"
            sed -n '1,240p' "$file"
          done

          echo
          echo "=== CM Build References ==="

          grep -R \
            -E 'TARGET_BOARD_PLATFORM|TARGET_BOOTLOADER_BOARD_NAME|PRODUCT_DEVICE|PRODUCT_NAME' \
            cm_build/core \
            cm_build/target \
            2>/dev/null | head -100 || true

          echo
          echo "=== CM11 Build Compatibility Inspection Complete ==="

      - name: Test CM product definition
        run: |
          set -e

          echo "=== Preparing CM build environment ==="

          CM_BUILD="$RUNNER_TEMP/cm_build"

          rm -rf "$CM_BUILD"
          git clone --depth=1 https://github.com/CyanogenmodMT6572/android_build.git "$CM_BUILD"

          mkdir -p "$CM_BUILD/device/gamma/ga_tab7v3g"

          rsync -a \
            --exclude='.git' \
            ./ "$CM_BUILD/device/gamma/ga_tab7v3g/"

          cd "$CM_BUILD"

          echo "=== Device tree installed ==="
          find device/gamma/ga_tab7v3g -maxdepth 2 -type f | sort

          echo "=== Checking CM build structure ==="
          ls -la build/ 2>/dev/null || echo "build/ directory not found"
          ls -la . | head -20

          echo "=== Loading CM build environment ==="
          export ANDROID_BUILD_TOP="$CM_BUILD"

          # The android_build repo should have envsetup.sh at root
          if [ -f ./envsetup.sh ]; then
            source ./envsetup.sh
          elif [ -f build/envsetup.sh ]; then
            source build/envsetup.sh
          else
            echo "ERROR: envsetup.sh not found"
            echo "Contents of $CM_BUILD:"
            find . -name "envsetup.sh" -o -name "*.sh" | head -20
            exit 1
          fi

          echo "=== Available GA-TAB7V3G lunch targets ==="
          if command -v lunch &> /dev/null; then
            lunch 2>&1 | grep -E 'ga_tab7v3g|Choice' || echo "No ga_tab7v3g target found"
          else
            echo "lunch command not available"
            exit 1
          fi

          echo "=== Attempting lunch ==="
          lunch cm_ga_tab7v3g-userdebug || {
            echo "ERROR: lunch failed"
            exit 1
          }
