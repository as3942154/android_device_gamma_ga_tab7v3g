name: Test Device Tree

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate device tree
        run: |
          set -e

          echo "=== Device Tree Validation ==="

          required_files="
          AndroidBoard.mk
          AndroidProducts.mk
          BoardConfig.mk
          device.mk
          device_ga_tab7v3g.mk
          MTKbootimg.mk
          recovery.fstab
          system.prop
          vendorsetup.sh
          "

          for file in $required_files; do
            if [ ! -e "$file" ]; then
              echo "ERROR: Missing $file"
              exit 1
            fi
            echo "OK: $file"
          done

          echo
          echo "=== Board Configuration ==="
          grep -E 'TARGET_BOARD_PLATFORM|TARGET_CPU_ABI|TARGET_ARCH|TARGET_BOOTLOADER_BOARD_NAME' BoardConfig.mk || true

          echo
          echo "=== Device Tree Validation Passed ==="
